# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: echolingo
metadata:
  template: echolingo@0.1.0
services:
  api:
    project: ./src/api
    language: ts
    host: function
    remoteBuild: true
  web:
    project: ./src/web
    language: ts
    host: staticwebapp
    dist: out
    hooks:
      prepackage:
        shell: sh
        run: |
          cd ../shared && npm run build
          cd ../web && npm run build
